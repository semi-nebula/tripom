name: Android APK

# Builds the PomoHarbor Android app (Capacitor wrapper around the same
# index.html the website serves, so all sync behaves identically).
# - Every push: builds a debug APK and uploads it as an artifact.
# - Tags like apk-v1.6.0: also publishes a GitHub Release with the APK.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Copy web assets + sync into Android project
        run: npm run cap:sync

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pomoharbor-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/apk-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: pomoharbor-debug-apk
          path: ./apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./apk/app-debug.apk
          name: PomoHarbor Android ${{ github.ref_name }}
          body: |
            PomoHarbor Android app (${{ github.ref_name }}).
            Same app as pomoharbor.vercel.app — timers, Pomodoro, schedule (incl. VIT import), study, journal, chat, cloud sync — plus real notifications that fire even with the app closed.
            Install: download `app-debug.apk` on your phone, open it, allow "install unknown apps" if asked.
